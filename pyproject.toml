[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-triage"
version = "0.1.0"
description = "Hermes plugin that triages the built-in memory store when it nears capacity."
requires-python = ">=3.9"
# SPDX string, not a TOML table: setuptools>=77 rejects `license = {text=...}`,
# which made `hermes plugins enable` fail the build for this plugin and then
# re-add it to plugins.disabled. Fixed 2026-09-27.
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"