[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-triage"
version = "0.1.0"
description = "Hermes plugin that triages the built-in memory store when it nears capacity."
requires-python = ">=3.9"
# SPDX string, not a TOML table: setuptools>=77 rejects `license = {text=...}`,
# which made `hermes plugins enable` fail the build for this plugin and then
# re-add it to plugins.disabled. Fixed 2026-09-27.
license = "MIT"

[tool.setuptools]
# DANGER 2026-09-27: without this, setuptools refuses the build ("Multiple
# top-level packages discovered in a flat-layout: ['plugin', 'memtriage',
# 'profile_seeds']"). That build failure is what kept the plugin permanently in
# plugins.disabled — every `hermes` CLI call rebuilt the environment, saw the
# failure, and put it straight back. `plugins.disabled: []` never held for more
# than a minute until this was declared.
packages = ["memtriage", "plugin"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.md", "*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"