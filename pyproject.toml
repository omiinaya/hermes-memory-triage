[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-triage"
version = "0.1.0"
description = "Hermes plugin that triages the built-in memory store when it nears capacity."
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"